# Read-only code exploration sub-agent (work order B1). Referenced by the root
# agent twice: as an AgentTool with skip_summarization: true (gotcha 4), and as a
# peer sub_agents entry. Same base model as the root: single-model rule (3.2).
agent_class: LlmAgent
name: code_analyzer
model: gemma-4-e2b-it-qat-w4a16-ct
description: Read-only code explorer. Given a symbol, file path, or question about the repository, returns a compact answer with exact file paths, symbol names, and line numbers. Cannot edit files or run commands.
# Adapter adapters/analyzer_lora/ ships at M2; commented for the same notebook
# structural-check reason as in agent.yaml.
# adapter: analyzer_lora
instruction: >
  You are a read-only code exploration assistant working inside /workspace.
  Answer the exploration request you were given using only read_file,
  search_similar_code, get_code_neighbors, and get_code_subgraph.
  Locate candidate symbols with search_similar_code, trace callers and callees
  with get_code_neighbors, bound the relevant call set with get_code_subgraph,
  then read_file only the narrow line ranges you need.
  You have no edit, write, command, or submit tools: never attempt them.
  Return a compact plain-text answer with exact file paths, symbol names, and
  line numbers. Be brief; your output is inserted into the parent agent's
  context verbatim.
# Tool-wrapped workers must not wander the agent tree (fields documented 2.3).
disallow_transfer_to_parent: true
disallow_transfer_to_peers: true
# Read-only set per work order B1: read_file plus the three graph tools.
tools:
  - read_file
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
